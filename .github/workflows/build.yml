name: Build IPA
on: [workflow_dispatch, push]

concurrency:
  group: editshift-ios-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-pub > flutter-analyze.log 2>&1 || true
      - name: Build unsigned iOS device app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --verbose 2>&1 | tee flutter-ios-build.log
      - name: Package device app as IPA
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: app.ipa
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            flutter-ios-build.log
            flutter-analyze.log
          if-no-files-found: ignore
